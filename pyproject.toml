[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "laglayer3"
version = "0.1.0"
description = "Layered control architecture for multi-agent air combat"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "torch>=2.0",
    "gymnasium>=0.29",
    "jsbsim>=1.1.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
